name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills-update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test ticket-bay-bot's skills update
        run: bash vps/skills-sync/test-skills-update.sh

  memory-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test ticket-bay-bot's memory diff
        run: bash vps/ticket-bay-bot/test-memory-diff.sh

  pull-repos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test ticket-bay-bot's daily report
        run: bash vps/ticket-bay-bot/test-pull-repos.sh

  revoke-gh-token:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test ticket-bay-bot's token revoke hook
        run: bash vps/ticket-bay-bot/test-revoke-gh-token.sh

  squid-denials:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test ticket-bay-bot's squid-deny alert
        run: bash vps/ticket-bay-bot/test-squid-denials.sh

  egress:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test ticket-bay-bot's squid allowlist (Docker)
        run: bash vps/ticket-bay-bot/egress/test-egress.sh

